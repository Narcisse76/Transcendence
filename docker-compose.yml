services:
  db:
    image: docker.io/postgres:16-alpine
    container_name: ft_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - transcendence
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ft_backend
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/app/vault.sh"]
    command: ["npm", "start"]
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"
    depends_on:
      vault:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - transcendence

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ft_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - transcendence

  game:
    build:
      context: ./server-test
      dockerfile: Dockerfile
    container_name: ft_game
    volumes:
      - users_data:/data
    ports:
      - 3001:3001
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
    networks:
      - transcendence

  proxy:
    build: ./proxy
    container_name: proxy_waf
    environment:
      ALLOWED_METHODS: "GET HEAD POST PUT DELETE OPTIONS"
    ports:
      - "8443:443"
      - "8080:80"
    depends_on:
      - frontend
      - backend
      - game
    networks:
      - transcendence

  vault:
    image: docker.io/hashicorp/vault:2.1
    container_name: vault
    restart: unless-stopped
    command: server -dev -dev-listen-address=0.0.0.0:8200 -dev-root-token-id=root
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    networks:
      - transcendence

  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=https://localhost:8443/prometheus/"
      - "--web.route-prefix=/prometheus/"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
    networks:
      - transcendence
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    build:
      context: ./monitoring/grafana
      dockerfile: Dockerfile
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - vault
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "https://localhost:8443/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - transcendence

  node-exporter:
    image: docker.io/prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "19100:9100"
    networks:
      - transcendence

networks:
  transcendence:
    driver: bridge

volumes:
  users_data:
  db_data:
  vault_data:
  grafana-data:
