# Mode: Anomaly Scoring (Recommended for hardened setups)
SecAction \
    "id:900000,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.blocking_paranoia_level=1,\
    setvar:tx.detection_paranoia_level=1"

# Anomaly Thresholds (Request: 5, Response: 4)
# Any request that accumulates scores >= 5 will be blocked (403)
SecAction \
    "id:900110,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# Allowed HTTP Methods for REST API & SPA
SecAction \
    "id:900200,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_methods=GET HEAD POST PUT PATCH DELETE OPTIONS'"

# Allowed Content-Types (JSON for NestJS API, multipart for avatar uploads)
SecAction \
    "id:900220,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json| |text/plain|'"

# Allowed HTTP Versions
SecAction \
    "id:900230,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_http_versions=HTTP/1.0 HTTP/1.1 HTTP/2 HTTP/2.0'"

# Enforce UTF-8 Encoding
SecAction \
    "id:900280,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.crs_validate_utf8_encoding=1"
